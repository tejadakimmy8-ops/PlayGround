    <circle cx="104" cy="160" r="2.2"/><circle cx="109" cy="160" r="2.2"/><circle cx="106.5" cy="156" r="2.2"/><circle cx="106.5" cy="164" r="2.2"/><circle cx="106.5" cy="160" r="1.6" fill="#e8cfa8"/>
    <circle cx="136" cy="190" r="2.2"/><circle cx="141" cy="190" r="2.2"/><circle cx="138.5" cy="186" r="2.2"/><circle cx="138.5" cy="194" r="2.2"/><circle cx="138.5" cy="190" r="1.6" fill="#e8cfa8"/>
    <circle cx="112" cy="226" r="2.2"/><circle cx="117" cy="226" r="2.2"/><circle cx="114.5" cy="222" r="2.2"/><circle cx="114.5" cy="230" r="2.2"/><circle cx="114.5" cy="226" r="1.6" fill="#e8cfa8"/>
    <circle cx="142" cy="244" r="2.2"/><circle cx="147" cy="244" r="2.2"/><circle cx="144.5" cy="240" r="2.2"/><circle cx="144.5" cy="248" r="2.2"/><circle cx="144.5" cy="244" r="1.6" fill="#e8cfa8"/>
    <circle cx="94" cy="200" r="2.2"/><circle cx="99" cy="200" r="2.2"/><circle cx="96.5" cy="196" r="2.2"/><circle cx="96.5" cy="204" r="2.2"/><circle cx="96.5" cy="200" r="1.6" fill="#e8cfa8"/>
  </g>
  <g fill="#7d8450" opacity="0.5">
    <ellipse cx="122" cy="176" rx="3" ry="1.8"/><ellipse cx="128" cy="212" rx="3" ry="1.8"/><ellipse cx="100" cy="242" rx="3" ry="1.8"/>
  </g>
  <ellipse cx="100" cy="160" rx="13" ry="34" fill="#ffffff" opacity="0.22"/>
  <!-- neck + head -->
  <rect x="111" y="94" width="18" height="22" rx="7" fill="#b57e4e" stroke="#5a4632" stroke-opacity="0.4" stroke-width="2"/>
  <ellipse cx="120" cy="70" rx="33" ry="34" fill="url(#gskin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5"/>
  <!-- side ponytail + scrunchie -->
  <path d="M150 66 q16 22 10 52 q-2 8 -9 7 q-7 -1 -7 -9 q3 -24 -4 -42 z" fill="url(#ghair)" stroke="#5a4632" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="147" cy="98" r="8" fill="#8fb0a5" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
