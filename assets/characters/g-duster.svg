  <!-- face -->
  <circle cx="108" cy="74" r="3.2" fill="#2e2620"/>
  <circle cx="132" cy="74" r="3.2" fill="#2e2620"/>
  <circle cx="109" cy="73" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="133" cy="73" r="1" fill="#fff" opacity="0.8"/>
  <path d="M110 88 q10 7 20 0" fill="none" stroke="#5a3226" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="99" cy="83" rx="6" ry="4" fill="#d97f6a" opacity="0.35"/>
  <ellipse cx="141" cy="83" rx="6" ry="4" fill="#d97f6a" opacity="0.35"/>
  <!-- washes -->
  <ellipse cx="140" cy="180" rx="14" ry="34" fill="#8a5f4e" opacity="0.14"/>
