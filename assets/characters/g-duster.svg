  <path d="M154 134 q9 36 7 62 q0 9 -8 9 q-8 0 -8 -9 q0 -26 -5 -58 z" fill="url(#gskin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="80" cy="206" r="9" fill="url(#gskin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="160" cy="206" r="9" fill="url(#gskin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5"/>
  <!-- duster body -->
  <path d="M88 118 q32 -12 64 0 q10 40 16 76 q4 40 6 72 q-30 10 -108 0 q2 -32 6 -72 q6 -36 16 -76 z" fill="url(#duster)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
