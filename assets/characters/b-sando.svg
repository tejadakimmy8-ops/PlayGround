<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-label="Apo boy starter: sando and puruntong">
  <title>Apo (boy) — Sando &amp; Puruntong, starter 1990</title>
  <defs>
    <radialGradient id="skin" cx="42%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#d29a68"/>
      <stop offset="60%" stop-color="#c08a58"/>
      <stop offset="100%" stop-color="#a96f42"/>
    </radialGradient>
    <linearGradient id="sando" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5ecda"/>
      <stop offset="100%" stop-color="#e2d3b4"/>
    </linearGradient>
    <linearGradient id="denim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ba0b4"/>
      <stop offset="100%" stop-color="#6e8499"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a382a"/>
      <stop offset="100%" stop-color="#2e2318"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="120" cy="332" rx="54" ry="10" fill="#6b5a44" opacity="0.18"/>
  <!-- back hair mass -->
  <ellipse cx="120" cy="66" rx="37" ry="36" fill="url(#hair)"/>
  <!-- legs -->
  <path d="M100 248 q-2 40 -1 66 q0 8 8 8 q8 0 8 -8 q1 -26 1 -66 z" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M124 248 q-1 40 0 66 q0 8 8 8 q8 0 8 -8 q1 -26 -1 -66 z" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- tsinelas -->
  <ellipse cx="108" cy="327" rx="17" ry="7.5" fill="#7a5230" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M108 320 l-6 6 M108 320 l6 6" stroke="#4a3826" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="133" cy="327" rx="17" ry="7.5" fill="#7a5230" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M133 320 l-6 6 M133 320 l6 6" stroke="#4a3826" stroke-width="2.5" stroke-linecap="round"/>
  <!-- puruntong shorts -->
  <path d="M92 194 q28 -10 56 0 l6 48 q1 8 -7 8 l-10 0 q-4 0 -5 -5 l-3 -18 l-4 0 l-3 18 q-1 5 -5 5 l-10 0 q-8 0 -7 -8 z" fill="url(#denim)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M96 244 l52 0" stroke="#5a4632" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="100" y="206" width="14" height="12" rx="2" fill="#6e8499" stroke="#5a4632" stroke-opacity="0.4" stroke-width="1.5"/>
  <ellipse cx="140" cy="222" rx="12" ry="10" fill="#a9bccd" opacity="0.45"/>
  <!-- arms -->
  <path d="M88 132 q-10 40 -8 70 q0 9 8 9 q8 0 8 -9 q0 -30 6 -66 z" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M152 132 q10 40 8 70 q0 9 -8 9 q-8 0 -8 -9 q0 -30 -6 -66 z" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="81" cy="212" r="9.5" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="159" cy="212" r="9.5" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5"/>
  <!-- sando -->
  <path d="M90 118 q30 -12 60 0 l4 8 q6 34 2 72 q-24 8 -72 0 q-4 -38 2 -72 z" fill="url(#sando)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M104 112 q16 14 32 0 q-4 10 -16 10 q-12 0 -16 -10" fill="#c08a58" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M90 122 q-2 22 -4 34 M150 122 q2 22 4 34" fill="none" stroke="#5a4632" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="128" y="148" width="16" height="14" rx="2" fill="#e2d3b4" stroke="#5a4632" stroke-opacity="0.45" stroke-width="2"/>
  <rect x="102" y="168" width="13" height="13" rx="1" fill="#cf9a7a" opacity="0.8" stroke="#5a4632" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 2"/>
  <ellipse cx="112" cy="140" rx="14" ry="18" fill="#ffffff" opacity="0.28"/>
  <!-- neck + head -->
  <rect x="111" y="94" width="18" height="22" rx="7" fill="#b57e4e" stroke="#5a4632" stroke-opacity="0.4" stroke-width="2"/>
  <ellipse cx="120" cy="70" rx="33" ry="34" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5"/>
  <circle cx="88" cy="74" r="7" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="152" cy="74" r="7" fill="url(#skin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <!-- fringe -->
  <path d="M88 62 q4 -30 32 -32 q28 -2 32 32 q-2 -6 -8 -8 q1 8 -3 12 q-3 -8 -9 -10 q0 9 -5 12 q-4 -8 -10 -9 q-2 8 -7 10 q-4 -6 -6 -12 q-6 2 -8 8 q-6 -8 -8 -3 z" fill="url(#hair)" stroke="#5a4632" stroke-opacity="0.4" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="108" cy="42" rx="12" ry="5" fill="#5d4a35" opacity="0.5"/>
  <!-- face -->
  <circle cx="108" cy="74" r="3.2" fill="#2e2620"/>
  <circle cx="132" cy="74" r="3.2" fill="#2e2620"/>
  <circle cx="109" cy="73" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="133" cy="73" r="1" fill="#fff" opacity="0.8"/>
  <path d="M110 88 q10 7 20 0" fill="none" stroke="#5a3226" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="99" cy="83" rx="6" ry="4" fill="#d97f6a" opacity="0.35"/>
  <ellipse cx="141" cy="83" rx="6" ry="4" fill="#d97f6a" opacity="0.35"/>
  <!-- watercolor washes -->
  <ellipse cx="135" cy="150" rx="16" ry="30" fill="#b09a72" opacity="0.14"/>
  <ellipse cx="100" cy="230" rx="10" ry="16" fill="#46586c" opacity="0.16"/>
