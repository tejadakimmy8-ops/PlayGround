<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-label="Apo girl starter: simple duster">
  <title>Apo (girl) — Simpleng Duster, starter 1990</title>
  <defs>
    <radialGradient id="gskin" cx="42%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#d29a68"/>
      <stop offset="60%" stop-color="#c08a58"/>
      <stop offset="100%" stop-color="#a96f42"/>
    </radialGradient>
    <linearGradient id="duster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dda991"/>
      <stop offset="100%" stop-color="#c08a72"/>
    </linearGradient>
    <linearGradient id="ghair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a382a"/>
      <stop offset="100%" stop-color="#2e2318"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="332" rx="54" ry="10" fill="#6b5a44" opacity="0.18"/>
  <!-- back hair (shoulder length) -->
  <path d="M84 60 q-4 60 4 96 q2 8 10 8 l4 0 q6 0 6 -8 l-2 -30 36 0 -2 30 q0 8 6 8 l4 0 q8 0 10 -8 q8 -36 4 -96 q-6 -30 -40 -30 q-34 0 -40 30 z" fill="url(#ghair)" stroke="#5a4632" stroke-opacity="0.4" stroke-width="2" stroke-linejoin="round"/>
  <!-- legs -->
  <path d="M102 262 q-2 30 -1 52 q0 8 8 8 q8 0 8 -8 q1 -22 1 -52 z" fill="url(#gskin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M122 262 q-1 30 0 52 q0 8 8 8 q8 0 8 -8 q1 -22 -1 -52 z" fill="url(#gskin)" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="110" cy="327" rx="15" ry="7" fill="#7a5230" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M110 320 l-5 6 M110 320 l5 6" stroke="#4a3826" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="131" cy="327" rx="15" ry="7" fill="#7a5230" stroke="#5a4632" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M131 320 l-5 6 M131 320 l5 6" stroke="#4a3826" stroke-width="2.5" stroke-linecap="round"/>
